<text x="852" y="246" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9a97b8" text-anchor="start" >python3 -m guild.server · SQLite</text>
