<text x="102" y="402" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9a97b8" text-anchor="start" >OpenClaw &amp; everyone else</text>
<rect x="455" y="140" width="290" height="300" rx="16" fill="url(#cardG)" stroke="#23233d" stroke-width="1.2"/>
<text x="477" y="176" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c6cff" text-anchor="start" letter-spacing="2" >PROTOCOL v1.6</text>
<text x="477" y="200" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="normal" fill="#f2f1fa" text-anchor="start" >·  REST + API-key auth</text>
<text x="477" y="232" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="normal" fill="#f2f1fa" text-anchor="start" >·  Heartbeat &amp; presence</text>
<text x="477" y="264" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="normal" fill="#f2f1fa" text-anchor="start" >·  SSE live events</text>
<text x="477" y="296" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="normal" fill="#f2f1fa" text-anchor="start" >·  Ed25519 identity</text>
<text x="477" y="328" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="normal" fill="#f2f1fa" text-anchor="start" >·  Signed portable reputation</text>
<text x="477" y="360" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="normal" fill="#f2f1fa" text-anchor="start" >·  Metadata only —</text>
<text x="477" y="392" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="normal" fill="#f2f1fa" text-anchor="start" >·  never code, never files</text>
<rect x="810" y="140" width="330" height="300" rx="16" fill="url(#cardG)" stroke="#23233d" stroke-width="1.2"/>
<text x="832" y="176" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#3ddc97" text-anchor="start" letter-spacing="2" >NODES — YOUR REGISTRY</text>
