<text x="60" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" fill="#f2f1fa" text-anchor="start" >Architecture — local-first by design</text>
<text x="60" y="104" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="normal" fill="#9a97b8" text-anchor="start" >The centre is the protocol, not a server. Every builder runs their own node.</text>
<rect x="60" y="140" width="330" height="300" rx="16" fill="url(#cardG)" stroke="#23233d" stroke-width="1.2"/>
<text x="82" y="176" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e8b34b" text-anchor="start" letter-spacing="2" >CLIENTS</text>
