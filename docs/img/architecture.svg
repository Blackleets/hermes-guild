<text x="102" y="220" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#f2f1fa" text-anchor="start" >Hermes plugin — flagship</text>
<text x="102" y="246" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#9a97b8" text-anchor="start" >/guild command · 4 tools · inbox</text>
