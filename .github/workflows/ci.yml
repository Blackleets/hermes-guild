name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The suite runs exactly as it does locally: a .venv whose only
      # installed package is pytest — GUILD itself is pure stdlib.
      - name: Create venv and install pytest
        run: |
          python -m venv .venv
          .venv/bin/pip install pytest

      - name: Run the test suite (118 tests)
        run: .venv/bin/python -m pytest tests/ -q
